<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2f9e6e">
<title>🌍 여행 영어 - 기초·생존 영어 학습</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232f9e6e'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
<style>
:root{
  --green:#2f9e6e; --green-d:#227a54; --green-l:#e6f5ee; --green-ll:#f4fbf7;
  --ink:#173a2c; --sub:#5a7a6b; --line:#d8ebe1; --bg:#eef7f2; --card:#ffffff;
  --gold:#f2a900; --red:#e2574c; --shadow:0 4px 18px rgba(34,122,84,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:24px}
.screen{display:none;padding:16px 16px 40px;animation:fade .25s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topbar{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;
  display:flex;align-items:center;gap:10px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.topbar h1{font-size:17px;font-weight:800;flex:1;letter-spacing:-.3px}
.topbar .icn{width:38px;height:38px;border:none;border-radius:12px;background:rgba(255,255,255,.16);
  color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.topbar .icn:active{transform:scale(.9)}
.stat{display:flex;gap:6px;align-items:center;font-weight:800;font-size:14px;
  background:rgba(255,255,255,.16);padding:6px 10px;border-radius:20px}
.hero{text-align:center;padding:24px 10px 10px}
.hero .globe{font-size:60px;line-height:1;filter:drop-shadow(0 6px 10px rgba(34,122,84,.25))}
.hero h2{font-size:24px;font-weight:900;margin-top:8px;letter-spacing:-.5px}
.hero p{color:var(--sub);font-size:14px;margin-top:4px}
.goalcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;
  display:flex;align-items:center;gap:16px;margin:0 0 14px}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:15px;color:var(--green-d)}
.goalcard .g-txt{flex:1}
.goalcard .g-txt b{font-size:15px}
.goalcard .g-txt span{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu .big{grid-column:1/3}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;
  cursor:pointer;box-shadow:var(--shadow);transition:.15s;text-align:left;font:inherit;color:inherit}
.tile:active{transform:scale(.97)}
.tile .emo{font-size:30px}
.tile h3{font-size:16px;font-weight:800;margin-top:8px}
.tile p{color:var(--sub);font-size:12.5px;margin-top:3px}
.tile.big{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;border:none}
.tile.big p{color:rgba(255,255,255,.85)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;
  cursor:pointer;box-shadow:var(--shadow);font:inherit;color:inherit;text-align:left;transition:.15s}
.cat:active{transform:scale(.96)}
.cat .emo{font-size:24px}
.cat b{display:block;font-size:14px;margin-top:6px;font-weight:800}
.cat span{color:var(--sub);font-size:12px}
.section-title{font-size:15px;font-weight:800;margin:6px 2px 4px;color:var(--green-d)}
.progressbar{height:8px;background:var(--line);border-radius:10px;overflow:hidden;margin:6px 2px 14px}
.progressbar>i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .3s}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px;font-size:13px;color:var(--sub);font-weight:700}
.combo{color:var(--gold)}
.qcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:26px 18px;text-align:center;margin-bottom:16px}
.qtype{display:inline-block;font-size:12px;font-weight:800;color:var(--green-d);background:var(--green-l);
  padding:5px 12px;border-radius:20px;margin-bottom:14px}
.qword{font-size:32px;font-weight:900;letter-spacing:-.5px;word-break:break-word}
.qipa{color:var(--sub);font-size:15px;margin-top:6px;font-family:'Times New Roman',serif}
.qsub{color:var(--sub);font-size:14px;margin-top:6px}
.listen-btn{margin-top:16px;background:var(--green);color:#fff;border:none;border-radius:50px;
  padding:14px 26px;font-size:16px;font-weight:800;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.listen-btn:active{transform:scale(.95)}
.listen-btn.big{font-size:34px;width:96px;height:96px;border-radius:50%;justify-content:center;padding:0}
.choices{display:grid;gap:10px}
.choice{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;
  font-size:16px;font-weight:700;cursor:pointer;text-align:center;transition:.12s;color:var(--ink);font-family:inherit}
.choice:active{transform:scale(.98)}
.choice.correct{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.choice.wrong{background:#fdecea;border-color:var(--red);color:var(--red)}
.choice:disabled{cursor:default}
.result{text-align:center;padding-top:20px}
.result .big-emo{font-size:70px}
.result h2{font-size:26px;font-weight:900;margin-top:6px}
.scorebox{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:22px;margin:16px 0;
  display:flex;justify-content:space-around}
.scorebox div b{font-size:26px;color:var(--green-d);display:block;font-weight:900}
.scorebox div span{font-size:12px;color:var(--sub)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;
  cursor:pointer;margin-top:10px;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{background:var(--card);color:var(--green-d);border:2px solid var(--line)}
.btn.gold{background:var(--gold);color:#5a3d00}
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar input{flex:1;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;
  outline:none;font-family:inherit;background:var(--card)}
.searchbar input:focus{border-color:var(--green)}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;
  font-size:13px;font-weight:700;cursor:pointer;color:var(--sub);font-family:inherit;transition:.12s}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.count-line{font-size:13px;color:var(--sub);margin:2px 2px 10px;font-weight:700}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px;
  margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(34,122,84,.06)}
.wcard .w-main{flex:1;min-width:0}
.wcard .w-en{font-size:17px;font-weight:800}
.wcard .w-en .pos{font-size:11px;color:var(--green-d);background:var(--green-l);padding:2px 7px;
  border-radius:8px;margin-left:6px;font-weight:700;vertical-align:middle}
.wcard .w-ipa{color:var(--sub);font-size:13px;font-family:'Times New Roman',serif}
.wcard .w-ko{font-size:14.5px;margin-top:2px}
.wcard .w-cat{font-size:11px;color:var(--sub);margin-top:3px}
.wcard .spk{flex:none;width:44px;height:44px;border:none;border-radius:12px;background:var(--green-l);
  color:var(--green-d);font-size:20px;cursor:pointer;transition:.12s}
.wcard .spk:active{transform:scale(.88)}
.lvl-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px;margin-left:6px}
.lvl1{background:#e6f5ee;color:#227a54}
.lvl2{background:#fff2d6;color:#a06f00}
.lvl3{background:#fde7e4;color:#b13c30}
.empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:14px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;
  margin-bottom:9px;box-shadow:0 2px 8px rgba(34,122,84,.06)}
.scard .s-top{display:flex;align-items:flex-start;gap:12px}
.scard .s-en{flex:1;font-size:16px;font-weight:700;line-height:1.4}
.scard .s-ko{color:var(--sub);font-size:14px;margin-top:6px}
.scard .spk{flex:none;width:42px;height:42px;border:none;border-radius:12px;background:var(--green-l);
  color:var(--green-d);font-size:19px;cursor:pointer}
.scard .spk:active{transform:scale(.88)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(23,58,44,.45);z-index:50;
  align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 20px 30px;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.modal h3{font-size:18px;font-weight:900;margin-bottom:14px}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-of-type{border:none}
.setrow .lbl b{font-size:15px}
.setrow .lbl span{display:block;font-size:12px;color:var(--sub)}
.toggle{width:52px;height:30px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;transition:.2s;border:none;flex:none}
.toggle.on{background:var(--green)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:25px}
.seg{display:flex;background:var(--green-l);border-radius:12px;padding:4px;gap:4px}
.seg button{border:none;background:none;padding:8px 12px;border-radius:9px;font-weight:800;font-size:13px;color:var(--sub);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--green-d);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.danger{color:var(--red);font-weight:800;background:none;border:none;font-size:14px;cursor:pointer;margin-top:14px;padding:8px;font-family:inherit}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 22px;border-radius:30px;font-weight:700;font-size:14px;z-index:99;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.footer-note{text-align:center;color:var(--sub);font-size:11px;margin-top:22px;opacity:.8}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="icn" id="homeBtn" title="홈">🏠</button>
    <h1 id="barTitle">🌍 여행 영어</h1>
    <div class="stat" title="연속 학습일"><span>🔥</span><span id="streakNum">0</span></div>
    <button class="icn" id="setBtn" title="설정">⚙️</button>
  </div>

  <section class="screen active" id="s-home">
    <div class="hero">
      <div class="globe">🌍</div>
      <h2>여행 영어</h2>
      <p>기초 회화부터 해외여행 생존 영어까지</p>
    </div>
    <div class="goalcard">
      <div class="ring">
        <svg width="74" height="74">
          <circle cx="37" cy="37" r="31" stroke="#e6f5ee" stroke-width="9" fill="none"/>
          <circle id="goalArc" cx="37" cy="37" r="31" stroke="#2f9e6e" stroke-width="9" fill="none"
            stroke-linecap="round" stroke-dasharray="195" stroke-dashoffset="195"/>
        </svg>
        <div class="val" id="goalVal">0/20</div>
      </div>
      <div class="g-txt">
        <b>오늘의 목표</b>
        <span id="goalDesc">퀴즈 20문제 풀기</span>
      </div>
    </div>
    <div class="menu">
      <button class="tile big" data-go="cat"><div class="emo">📝</div><h3>주제별 단어 퀴즈</h3><p>주제 선택 → 4지선다 10문제</p></button>
      <button class="tile" id="resumeTile" style="display:none" data-go="resume"><div class="emo">⏯️</div><h3 style="font-size:15px">이어하기</h3><p id="resumeDesc"></p></button>
      <button class="tile" data-go="review"><div class="emo">🔁</div><h3 style="font-size:15px">오답 복습</h3><p id="reviewDesc">0개 대기</p></button>
      <button class="tile" data-go="dict"><div class="emo">📖</div><h3 style="font-size:15px">단어 사전</h3><p id="dictCount">단어 검색·발음</p></button>
      <button class="tile" data-go="phr"><div class="emo">💬</div><h3 style="font-size:15px">회화 문장</h3><p>상황별 여행 표현</p></button>
    </div>
    <p class="footer-note">🔊 발음은 미국식 원어민 음성(TTS)으로 재생됩니다</p>
  </section>

  <section class="screen" id="s-cat">
    <p class="section-title">주제를 골라 퀴즈를 시작하세요</p>
    <p class="count-line" id="catHint">각 주제 10문제 · 영어↔뜻 + 듣기 문제 혼합</p>
    <div class="cat-grid" id="catGrid"></div>
  </section>

  <section class="screen" id="s-quiz">
    <div class="qmeta">
      <span id="qCount">1 / 10</span>
      <span class="combo" id="qCombo"></span>
    </div>
    <div class="progressbar"><i id="qBar" style="width:0%"></i></div>
    <div class="qcard" id="qCard"></div>
    <div class="choices" id="qChoices"></div>
  </section>

  <section class="screen" id="s-result">
    <div class="result">
      <div class="big-emo" id="rEmo">🎉</div>
      <h2 id="rTitle">완료!</h2>
      <div class="scorebox">
        <div><b id="rScore">0</b><span>정답</span></div>
        <div><b id="rTotal">10</b><span>문제</span></div>
        <div><b id="rPct">0%</b><span>정답률</span></div>
      </div>
      <button class="btn primary" id="retryBtn">다시 풀기</button>
      <button class="btn gold" id="rReviewBtn" style="display:none">오답 복습하기</button>
      <button class="btn ghost" data-go="cat">다른 주제 선택</button>
      <button class="btn ghost" data-go="home">홈으로</button>
    </div>
  </section>

  <section class="screen" id="s-dict">
    <div class="searchbar">
      <input id="dictSearch" type="text" placeholder="영어 또는 한국어 뜻으로 검색" autocomplete="off">
    </div>
    <div class="filters" id="lvlFilters">
      <button class="chip on" data-lvl="all">전체</button>
      <button class="chip" data-lvl="1">기초</button>
      <button class="chip" data-lvl="2">중급</button>
      <button class="chip" data-lvl="3">심화</button>
    </div>
    <div class="filters" id="catFilters"></div>
    <p class="count-line" id="dictResult"></p>
    <div id="dictList"></div>
  </section>

  <section class="screen" id="s-phr">
    <div class="filters" id="phrFilters"></div>
    <div id="phrList"></div>
  </section>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>⚙️ 설정</h3>
    <div class="setrow">
      <div class="lbl"><b>효과음</b><span>정답 딩동댕 / 오답 땡</span></div>
      <button class="toggle on" id="tgSound"></button>
    </div>
    <div class="setrow">
      <div class="lbl"><b>자동 발음</b><span>퀴즈 문제 나올 때 자동 재생</span></div>
      <button class="toggle" id="tgAutoTTS"></button>
    </div>
    <div class="setrow">
      <div class="lbl"><b>발음 속도</b><span>TTS 재생 속도</span></div>
      <div class="seg" id="segRate">
        <button data-rate="0.7">느리게</button>
        <button data-rate="0.9" class="on">보통</button>
        <button data-rate="1">빠르게</button>
      </div>
    </div>
    <div class="setrow">
      <div class="lbl"><b>일일 목표</b><span>하루 목표 문제 수</span></div>
      <div class="seg" id="segGoal">
        <button data-goal="10">10</button>
        <button data-goal="20" class="on">20</button>
        <button data-goal="30">30</button>
      </div>
    </div>
    <button class="danger" id="resetBtn">⚠️ 학습 기록 초기화</button>
    <button class="btn primary" id="closeModal" style="margin-top:16px">닫기</button>
  </div>
</div>

let voices=[];

function speak(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=ST.rate;
  const v=voices.find(v=>/en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

let actx;
function beep(ok){
  if(!ST.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes= ok?[523,659,784]:[311,196];
    let t=actx.currentTime;
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=ok?'sine':'square';o.frequency.value=f;
      o.connect(g);g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t);o.stop(t+0.17);t+=ok?0.12:0.16;
    });
  }catch(e){}
}

let quiz=null;
function pick(arr,n,exclude){const pool=arr.filter(x=>x!==exclude);const r=[];const used=new Set();while(r.length<n&&used.size<pool.length){const i=Math.floor(Math.random()*pool.length);if(used.has(i))continue;used.add(i);r.push(pool[i]);}return r;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function optionsFor(w,type,pool){
  const disp=x=>type==='ko2en'?x[0]:x[3];
  const correct=disp(w);
  const opts=[correct];const seen=new Set([correct]);
  for(const src of [pool,DICT]){
    for(const c of shuffle(src.filter(x=>x!==w))){
      const dv=disp(c);
      if(seen.has(dv))continue;
      seen.add(dv);opts.push(dv);
      if(opts.length===4)break;
    }
    if(opts.length===4)break;
  }
  return shuffle(opts);
}
function buildQuestions(pool){
  const qs=[];const chosen=shuffle([...pool]).slice(0,10);
  chosen.forEach(w=>{
    const type=['en2ko','ko2en','listen'][Math.floor(Math.random()*3)];
    qs.push({w,type,opts:optionsFor(w,type,pool)});
  });
  return qs;
}
function startQuiz(cat,fromResume){
  const pool=DICT.filter(w=>w[5]===cat);
  if(pool.length<4){toast('단어가 부족한 주제예요');return;}
  if(fromResume&&ST.resume&&ST.resume.cat===cat){
    quiz={cat,qs:ST.resume.qs,idx:ST.resume.idx,score:ST.resume.score,combo:ST.resume.combo,maxCombo:ST.resume.maxCombo,mode:'topic'};
  }else{
    quiz={cat,qs:buildQuestions(pool),idx:0,score:0,combo:0,maxCombo:0,mode:'topic'};
  }
  show('quiz');renderQ();
}
function startReview(){
  if(ST.wrong.length<1){toast('복습할 오답이 없어요 👍');return;}
  const pool=ST.wrong.map(k=>DICT.find(w=>w[0]+'|'+w[3]===k)).filter(Boolean);
  if(pool.length<1){ST.wrong=[];save();toast('복습할 오답이 없어요');return;}
  const qs=shuffle([...pool]).slice(0,10).map(w=>{
    const type=['en2ko','ko2en','listen'][Math.floor(Math.random()*3)];
    return{w,type,opts:optionsFor(w,type,DICT)};
  });
  quiz={cat:'오답 복습',qs,idx:0,score:0,combo:0,maxCombo:0,mode:'review'};
  show('quiz');renderQ();
}
function saveResume(){
  if(quiz&&quiz.mode==='topic'&&quiz.idx<quiz.qs.length){
    ST.resume={cat:quiz.cat,qs:quiz.qs,idx:quiz.idx,score:quiz.score,combo:quiz.combo,maxCombo:quiz.maxCombo};
  }else{ST.resume=null;}
  save();
}
function escapeQ(s){return s.replace(/'/g,"\\'");}
function renderQ(){
  const q=quiz.qs[quiz.idx];const w=q.w;
  document.getElementById('qCount').textContent=(quiz.idx+1)+' / '+quiz.qs.length;
  document.getElementById('qBar').style.width=(quiz.idx/quiz.qs.length*100)+'%';
  document.getElementById('qCombo').textContent=quiz.combo>=2?('🔥 '+quiz.combo+' 콤보'):'';
  const card=document.getElementById('qCard');
  let typeLabel,body;
  if(q.type==='en2ko'){
    typeLabel='영어 → 뜻';
    body=`<div class="qword">${w[0]}</div><div class="qipa">${w[2]?'/'+w[2]+'/':''}</div>
      <button class="listen-btn" onclick="speak('${escapeQ(w[0])}')">🔊 발음 듣기</button>`;
  }else if(q.type==='ko2en'){
    typeLabel='뜻 → 영어';
    body=`<div class="qword" style="font-size:26px">${w[3]}</div><div class="qsub">알맞은 영어 단어는?</div>`;
  }else{
    typeLabel='듣기 → 영어';
    body=`<div class="qsub" style="margin-bottom:4px">잘 듣고 알맞은 뜻을 고르세요</div>
      <button class="listen-btn big" onclick="speak('${escapeQ(w[0])}')">🔊</button>`;
  }
  card.innerHTML=`<div class="qtype">${typeLabel}</div>${body}`;
  const box=document.getElementById('qChoices');box.innerHTML='';
  q.opts.forEach(opt=>{
    const b=document.createElement('button');b.className='choice';b.textContent=opt;
    b.onclick=()=>answer(b,opt,q);
    box.appendChild(b);
  });
  if((q.type==='en2ko'||q.type==='listen')&&ST.autoTTS)setTimeout(()=>speak(w[0]),300);
  saveResume();
}
function answer(btn,opt,q){
  const w=q.w;
  const correct=(q.type==='ko2en')?w[0]:w[3];
  const buttons=[...document.querySelectorAll('.choice')];
  buttons.forEach(b=>b.disabled=true);
  const key=w[0]+'|'+w[3];
  if(opt===correct){
    btn.classList.add('correct');beep(true);
    quiz.score++;quiz.combo++;quiz.maxCombo=Math.max(quiz.maxCombo,quiz.combo);
    ST.wrong=ST.wrong.filter(k=>k!==key);
  }else{
    btn.classList.add('wrong');beep(false);quiz.combo=0;
    buttons.forEach(b=>{if(b.textContent===correct)b.classList.add('correct');});
    if(!ST.wrong.includes(key))ST.wrong.push(key);
  }
  ST.todayCount++;
  save();
  setTimeout(()=>{
    quiz.idx++;
    if(quiz.idx>=quiz.qs.length)finishQuiz();
    else renderQ();
  },opt===correct?650:1250);
}
function finishQuiz(){
  document.getElementById('qBar').style.width='100%';
  const t=todayStr();
  if(ST.lastDay!==t){
    const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    ST.streak=(ST.lastDay===y)?ST.streak+1:1;
    ST.lastDay=t;
  }
  ST.resume=null;save();
  const pct=Math.round(quiz.score/quiz.qs.length*100);
  document.getElementById('rScore').textContent=quiz.score;
  document.getElementById('rTotal').textContent=quiz.qs.length;
  document.getElementById('rPct').textContent=pct+'%';
  document.getElementById('rEmo').textContent=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'👍':'💪';
  document.getElementById('rTitle').textContent=pct>=90?'완벽해요!':pct>=70?'잘했어요!':pct>=50?'좋아요!':'다시 도전!';
  document.getElementById('rReviewBtn').style.display=ST.wrong.length>0?'':'none';
  quiz._lastCat=quiz.cat;quiz._lastMode=quiz.mode;
  renderHome();
  show('result');
}

let dictLvl='all',dictCat='all';
function renderDict(){
  const q=document.getElementById('dictSearch').value.trim().toLowerCase();
  let list=DICT.filter(w=>{
    if(dictLvl!=='all'&&String(w[4])!==dictLvl)return false;
    if(dictCat!=='all'&&w[5]!==dictCat)return false;
    if(q&&!(w[0].toLowerCase().includes(q)||w[3].toLowerCase().includes(q)||w[2].includes(q)))return false;
    return true;
  });
  document.getElementById('dictResult').textContent=list.length+'개 단어';
  const box=document.getElementById('dictList');
  if(!list.length){box.innerHTML='<div class="empty">검색 결과가 없어요 😅</div>';return;}
  box.innerHTML='';
  const frag=document.createDocumentFragment();
  list.slice(0,300).forEach(w=>{
    const lv=w[4]===1?'기초':w[4]===2?'중급':'심화';
    const d=document.createElement('div');d.className='wcard';
    d.innerHTML=`<div class="w-main">
      <div class="w-en">${w[0]}<span class="pos">${w[1]}</span><span class="lvl-badge lvl${w[4]}">${lv}</span></div>
      <div class="w-ipa">${w[2]?'/'+w[2]+'/':''}</div>
      <div class="w-ko">${w[3]}</div>
      <div class="w-cat">${CAT_EMOJI[w[5]]||''} ${w[5]}</div>
    </div>
    <button class="spk">🔊</button>`;
    d.querySelector('.spk').onclick=()=>speak(w[0]);
    frag.appendChild(d);
  });
  box.appendChild(frag);
  if(list.length>300){const m=document.createElement('div');m.className='count-line';m.style.textAlign='center';m.textContent='...외 '+(list.length-300)+'개 (검색으로 좁혀보세요)';box.appendChild(m);}
}
function renderCatFilters(){
  const box=document.getElementById('catFilters');box.innerHTML='';
  const all=document.createElement('button');all.className='chip on';all.textContent='모든 주제';all.dataset.cat='all';box.appendChild(all);
  CATS.forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=CAT_EMOJI[c]+' '+c;b.dataset.cat=c;box.appendChild(b);});
  box.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));ch.classList.add('on');dictCat=ch.dataset.cat;renderDict();});
}

let phrCat=SENT_CATS[0];
function renderPhrFilters(){
  const box=document.getElementById('phrFilters');box.innerHTML='';
  SENT_CATS.forEach((c,i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' on':'');b.textContent=c;b.dataset.c=c;
    b.onclick=()=>{box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');phrCat=c;renderPhr();};box.appendChild(b);});
}
function renderPhr(){
  const box=document.getElementById('phrList');box.innerHTML='';
  SENT.filter(s=>s[2]===phrCat).forEach(s=>{
    const d=document.createElement('div');d.className='scard';
    d.innerHTML=`<div class="s-top"><div class="s-en">${s[0]}</div><button class="spk">🔊</button></div><div class="s-ko">${s[1]}</div>`;
    d.querySelector('.spk').onclick=()=>speak(s[0]);
    box.appendChild(d);
  });
}

function syncSettings(){
  document.getElementById('tgSound').classList.toggle('on',ST.sound);
  document.getElementById('tgAutoTTS').classList.toggle('on',ST.autoTTS);
  document.querySelectorAll('#segRate button').forEach(b=>b.classList.toggle('on',+b.dataset.rate===ST.rate));
  document.querySelectorAll('#segGoal button').forEach(b=>b.classList.toggle('on',+b.dataset.goal===ST.goal));
}
document.getElementById('setBtn').onclick=()=>{syncSettings();document.getElementById('modalBg').classList.add('show');};
document.getElementById('closeModal').onclick=()=>document.getElementById('modalBg').classList.remove('show');
document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')e.currentTarget.classList.remove('show');};
document.getElementById('tgSound').onclick=function(){ST.sound=!ST.sound;this.classList.toggle('on',ST.sound);save();if(ST.sound)beep(true);};
document.getElementById('tgAutoTTS').onclick=function(){ST.autoTTS=!ST.autoTTS;this.classList.toggle('on',ST.autoTTS);save();};
document.getElementById('segRate').onclick=e=>{if(e.target.dataset.rate){ST.rate=+e.target.dataset.rate;save();syncSettings();speak('This is the speed.');}};
document.getElementById('segGoal').onclick=e=>{if(e.target.dataset.goal){ST.goal=+e.target.dataset.goal;save();syncSettings();renderHome();}};
document.getElementById('resetBtn').onclick=()=>{if(confirm('학습 기록(스트릭·오답·목표)을 모두 초기화할까요?')){localStorage.removeItem('engstudy');ST=Object.assign({},DEFAULT);ST.goalDate=todayStr();save();document.getElementById('modalBg').classList.remove('show');renderHome();toast('초기화되었습니다');}};

document.getElementById('homeBtn').onclick=()=>{renderHome();show('home');};
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(!go)return;
  const d=go.dataset.go;
  if(d==='cat'){renderCats();show('cat');}
  else if(d==='home'){renderHome();show('home');}
  else if(d==='dict'){show('dict');renderDict();}
  else if(d==='phr'){show('phr');renderPhr();}
  else if(d==='review'){startReview();}
  else if(d==='resume'){if(ST.resume)startQuiz(ST.resume.cat,true);}
});
document.getElementById('rReviewBtn').onclick=()=>startReview();
document.getElementById('retryBtn').onclick=()=>{if(quiz&&quiz._lastMode==='review')startReview();else if(quiz)startQuiz(quiz._lastCat);};

document.getElementById('dictSearch').addEventListener('input',renderDict);
document.getElementById('lvlFilters').onclick=e=>{if(e.target.dataset.lvl){document.querySelectorAll('#lvlFilters .chip').forEach(c=>c.classList.remove('on'));e.target.classList.add('on');dictLvl=e.target.dataset.lvl;renderDict();}};

renderCatFilters();renderPhrFilters();renderHome();
</script>
</body>
